<title>Bầu trời của Thu Huyền</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Be+Vietnam+Pro:wght@300;400;500&family=Baloo+2:wght@600;700&display=swap">
<style>
  /* Layout: full-bleed WebGL sky; words set low over the grass like film subtitles, controls tucked in the top corner */
  :root {
    --night: #0a1a38;
    --sky: #8ccfee;
    --ice: #eef8ff;
    --ink: #0f2c55;
    --glass: rgba(235, 246, 255, 0.16);
    --line: rgba(235, 246, 255, 0.4);
    --shadow: rgba(12, 40, 86, 0.55);
    --script: "Dancing Script", "Segoe Script", "Brush Script MT", cursive;
    --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --round: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
    --bubble: #fffdf6;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--ice); font-family: var(--sans); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #c:active { cursor: grabbing; }

  /* Intro */
  #intro {
    position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 16px;
    background: linear-gradient(180deg, rgba(70, 150, 225, 0.28), rgba(10, 30, 70, 0.5));
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
    transition: opacity 1.8s ease; z-index: 5;
  }
  #intro.hide { opacity: 0; pointer-events: none; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 34rem; }
  .eyebrow { margin: 0; font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase; opacity: 0.85; font-variant-numeric: tabular-nums; }
  .card h1 {
    margin: 0; font-family: var(--script); font-weight: 700; line-height: 1.05;
    font-size: clamp(52px, 14vw, 104px); text-wrap: balance;
    text-shadow: 0 4px 30px var(--shadow), 0 1px 2px var(--shadow);
  }
  .lead { margin: 0; font-weight: 300; font-size: clamp(16px, 4vw, 19px); text-shadow: 0 1px 10px var(--shadow); }
  #startBtn {
    margin-top: 14px; border: 0; border-radius: 999px; padding: 15px 38px;
    background: var(--ice); color: var(--ink); font: 500 16px/1 var(--sans); letter-spacing: 0.06em;
    box-shadow: 0 0 0 6px rgba(238, 248, 255, 0.18), 0 10px 40px rgba(140, 207, 238, 0.55);
    cursor: pointer; transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  #startBtn:hover { transform: translateY(-2px); box-shadow: 0 0 0 9px rgba(238, 248, 255, 0.2), 0 14px 46px rgba(140, 207, 238, 0.7); }
  #startBtn:focus-visible, .ctl:focus-visible { outline: 2px solid var(--ice); outline-offset: 4px; }
  .tip { margin: 0; font-size: 13px; font-weight: 300; opacity: 0.8; }

  /* Story lines */
  #story {
    position: fixed; left: 16px; right: 16px; bottom: calc(11vh + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    text-align: center; pointer-events: none; transition: opacity 1.4s ease; z-index: 3;
  }
  #story.out { opacity: 0; }
  .line {
    margin: 0; max-width: 22ch; font-family: var(--script); font-weight: 600; line-height: 1.22;
    font-size: clamp(30px, 6.6vw, 58px); text-wrap: balance;
    text-shadow: 0 2px 22px var(--shadow), 0 1px 3px var(--shadow);
  }
  .sub { margin: 0; max-width: 40ch; font-weight: 300; font-size: clamp(15px, 3.8vw, 20px); text-shadow: 0 1px 12px var(--shadow); }
  .w { display: inline-block; white-space: nowrap; }
  .ch { display: inline-block; opacity: 0; transform: translateY(12px); filter: blur(5px); animation: rise 1s cubic-bezier(.2, .7, .2, 1) forwards; }
  .sub.fade { opacity: 0; animation: rise 1.6s ease forwards; }
  @keyframes rise { to { opacity: 1; transform: none; filter: none; } }

  /* Controls & hint */
  #controls {
    position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px;
    display: flex; gap: 10px; z-index: 4; transition: opacity 1s ease;
  }
  .ctl {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--glass); color: var(--ice); display: grid; place-items: center; cursor: pointer;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .ctl svg { width: 20px; height: 20px; }
  #hint {
    position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    max-width: calc(100% - 140px); padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--glass); font-size: 13px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    opacity: 0; transition: opacity 1s ease; pointer-events: none; z-index: 4;
  }
  #hint.show { opacity: 1; }
  #fallback { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 16px; text-align: center; background: linear-gradient(#2f86e0, #bfe5fb); color: var(--ink); }

  /* Walking HUD */
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--ice); box-shadow: 0 0 0 2px rgba(12, 40, 86, 0.35); pointer-events: none; z-index: 4; }
  #guide { position: fixed; left: 0; top: 0; width: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #guide.show { opacity: 1; }
  #guide .ga { width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-bottom: 20px solid var(--ice); filter: drop-shadow(0 0 8px rgba(140, 207, 238, 0.9)); transform: translateY(-50%) rotate(var(--rot, 0deg)); }
  #guide span { white-space: nowrap; font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #prompt {
    position: fixed; left: 50%; bottom: calc(27vh + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 4;
    padding: 12px 22px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); color: var(--ice);
    font: 500 15px/1.2 var(--sans); cursor: pointer; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 0 24px rgba(140, 207, 238, 0.45);
  }
  #joy { position: fixed; left: 0; top: 0; width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--line); background: rgba(235, 246, 255, 0.08); z-index: 4; pointer-events: none; }
  #joyKnob { position: absolute; left: 34px; top: 34px; width: 52px; height: 52px; border-radius: 50%; background: var(--glass); border: 1px solid var(--line); }
  /* Butterfly speech bubble: anchored by its tail to the butterfly on screen */
  #bubble { position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; will-change: transform; }
  #bubble .b {
    position: absolute; left: 0; bottom: 0; transform-origin: 0 100%;
    padding: 9px 16px 8px; border-radius: 20px 20px 20px 6px; white-space: nowrap;
    background: var(--bubble); color: var(--ink); font: 700 clamp(16px, 3.8vw, 21px)/1.2 var(--round);
    box-shadow: 0 10px 28px rgba(8, 30, 70, 0.28), 0 0 0 3px rgba(140, 207, 238, 0.55);
    animation: bpop 0.55s cubic-bezier(.34, 1.56, .64, 1) both, bfloat 2.6s ease-in-out 0.55s infinite;
  }
  #bubble .b::after {
    content: ""; position: absolute; left: 8px; bottom: -11px; width: 0; height: 0;
    border-style: solid; border-width: 12px 12px 0 0; border-color: var(--bubble) transparent transparent transparent;
    filter: drop-shadow(0 3px 2px rgba(8, 30, 70, 0.15));
  }
  #bubble.out .b { animation: bout 0.35s ease-in both; }
  #bubble .bc { display: inline-block; opacity: 0; transform: translateY(6px) scale(0.6); animation: bch 0.32s cubic-bezier(.34, 1.56, .64, 1) forwards; }
  #bubble .heart { position: absolute; left: 50%; bottom: 100%; font-size: 14px; opacity: 0; animation: bheart 1.8s ease-out forwards; }
  @keyframes bpop { from { transform: scale(0.2) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes bfloat { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-1.5deg); } }
  @keyframes bout { to { transform: scale(0.3) translateY(10px); opacity: 0; } }
  @keyframes bch { to { opacity: 1; transform: none; } }
  @keyframes bheart { 0% { opacity: 0; transform: translate(0, 0) scale(0.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--hx, 10px), -46px) scale(1.1); } }
  /* Long-distance card */
  #ldr {
    position: fixed; top: calc(70px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    width: min(440px, calc(100% - 32px)); z-index: 4; display: flex; flex-direction: column; align-items: center; gap: 8px;
    animation: ldrIn 0.9s cubic-bezier(.2, .8, .2, 1) both;
  }
  #ldrBtn {
    border: 1px solid var(--line); background: var(--glass); color: var(--ice); border-radius: 999px; padding: 5px 12px; cursor: pointer;
    font: 600 13px/1 var(--sans); font-variant-numeric: tabular-nums; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  #ldrBtn:focus-visible { outline: 2px solid var(--ice); outline-offset: 3px; }
  .ldr-mini { display: inline-flex; align-items: center; gap: 8px; }
  .ldr-mini .flag { width: 20px; height: 13px; }
  .ldr-card {
    width: 100%; padding: 14px 16px 16px; border-radius: 20px; border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(20, 50, 100, 0.55), rgba(10, 26, 56, 0.6)); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: 0 18px 50px rgba(0, 10, 30, 0.45); text-align: center; display: flex; flex-direction: column; gap: 6px;
  }
  #ldr.min .ldr-card { display: none; }
  .ldr-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1fr); align-items: end; gap: 6px; }
  .ldr-place { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .ldr-place .flag { width: 34px; height: 23px; border-radius: 3px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); }
  .ldr-place b { font: 700 15px/1.2 var(--round); }
  .ldr-time { font-size: 13px; opacity: 0.85; font-variant-numeric: tabular-nums; }
  .ldr-arc { width: 100%; height: auto; overflow: visible; }
  .ldr-glow { stroke-dasharray: 260; stroke-dashoffset: 260; animation: ldrDraw 2.2s ease 0.4s forwards; filter: drop-shadow(0 0 4px var(--sky)); }
  .ldr-km { margin: 0; font: 700 clamp(30px, 8vw, 40px)/1 var(--round); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; text-shadow: 0 0 18px rgba(140, 207, 238, 0.6); }
  .ldr-km small { font-size: 0.5em; font-weight: 600; opacity: 0.85; }
  .ldr-line { margin: 0 auto; max-width: 34ch; font-weight: 300; font-size: 14.5px; line-height: 1.45; text-wrap: balance; }
  @media (min-width: 1000px) {
    #ldr { left: 16px; transform: none; width: 296px; align-items: flex-start; animation-name: ldrInSide; }
  }
  @keyframes ldrInSide { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  @keyframes ldrIn { from { opacity: 0; transform: translate(-50%, -14px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes ldrDraw { to { stroke-dashoffset: 0; } }
  /* Enlarged photo */
  #viewer {
    position: fixed; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding-inline: 16px; background: rgba(5, 14, 34, 0.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; transition: opacity 0.35s ease; cursor: pointer;
  }
  #viewer.show { opacity: 1; }
  #viewer img {
    max-width: min(86vw, 460px); max-height: 78vh; height: auto; transform: rotate(-2deg) scale(0.92);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(140, 200, 255, 0.25); transition: transform 0.45s cubic-bezier(.2, .8, .2, 1.2);
  }
  #viewer.show img { transform: rotate(-2deg) scale(1); }
  #viewer p { margin: 0; font-size: 13px; opacity: 0.75; }
  @media (prefers-reduced-motion: reduce) {
    .ch, .sub.fade, #bubble .b, #bubble .bc { animation: none; opacity: 1; transform: none; filter: none; }
  }
</style>

<canvas id="c" aria-label="Bầu trời 3D: ngày, hoàng hôn và đêm sao"></canvas>

<div id="intro">
  <div class="card">
    <p class="eyebrow">20 · 10 · 2026</p>
    <h1>Gửi <span data-name>Thu Huyền</span></h1>
    <p class="lead">Một bầu trời nhỏ, dành riêng cho em.</p>
    <button id="startBtn" type="button">Mở quà</button>
    <p class="tip" id="tipTxt">Bật âm thanh nhé · W A S D để đi, chuột để nhìn quanh</p>
  </div>
</div>

<div id="story" class="out" aria-live="polite"></div>
<div id="viewer" hidden><img id="viewerImg" alt="Ảnh kỷ niệm"><p>Chạm để đóng</p></div>
<div id="hint"></div>
<div id="crosshair" hidden></div>
<div id="ldr" hidden>
  <button id="ldrBtn" type="button" aria-label="Thu gọn hoặc mở thẻ khoảng cách">
    <span class="ldr-mini"><span data-flag="a"></span><b><span class="ldrKmMini">0</span> km</b><span data-flag="b"></span></span>
  </button>
  <div class="ldr-card">
    <div class="ldr-row">
      <div class="ldr-place"><span data-flag="a"></span><b id="ldrCityA"></b><span class="ldr-time" id="ldrTimeA"></span></div>
      <svg class="ldr-arc" viewBox="0 0 200 70" aria-hidden="true">
        <path id="ldrPath" d="M12 58 Q100 -14 188 58" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>
        <path d="M12 58 Q100 -14 188 58" fill="none" stroke="var(--sky)" stroke-width="2.4" stroke-linecap="round" class="ldr-glow"/>
        <circle cx="12" cy="58" r="4.5" fill="var(--ice)"/><circle cx="188" cy="58" r="4.5" fill="var(--ice)"/>
        <g><path d="M0 -2.2c-1.6-2.6-5.4-1.4-5 1.6.3 2.3 3 4 5 5.6 2-1.6 4.7-3.3 5-5.6.4-3-3.4-4.2-5-1.6z" fill="#ff6f91" transform="scale(1.3)"/>
          <animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"><mpath href="#ldrPath"/></animateMotion></g>
      </svg>
      <div class="ldr-place"><span data-flag="b"></span><b id="ldrCityB"></b><span class="ldr-time" id="ldrTimeB"></span></div>
    </div>
    <p class="ldr-km"><span id="ldrKm">0</span><small> km</small></p>
    <p class="ldr-line" id="ldrLine"></p>
  </div>
</div>
<div id="bubble" hidden><div class="b"><span id="bubbleTxt"></span></div></div>
<div id="guide"><div class="ga"></div><span id="guideTxt"></span></div>
<button id="prompt" type="button" hidden></button>
<div id="joy" hidden><div id="joyKnob"></div></div>

<div id="controls" hidden>
  <button class="ctl" id="soundBtn" type="button" aria-label="Tắt âm thanh">
    <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
  </button>
  <button class="ctl" id="nightBtn" type="button" aria-label="Chuyển nhanh sang buổi tối" title="Chuyển nhanh sang buổi tối">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <button class="ctl" id="replayBtn" type="button" aria-label="Xem lại từ đầu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(() => {
  /* ============ NỘI DUNG — sửa tên và lời chúc ở đây ============ */
  const CONFIG = {
    name: 'Thu Huyền',
    story: [
      { at: 2,  dur: 7, text: 'Như những đóa hướng dương luôn hướng về phía mặt trời…' },
      { at: 11, dur: 8, text: 'Mong em lúc nào cũng rạng rỡ và ấm áp như thế' },
      { at: 24, dur: 8, text: 'Mong em luôn được yêu thương như cách em vẫn yêu thương mọi người' },
      { at: 118, dur: 9, text: 'Dù nắng có tắt, nụ cười của em vẫn là điều rực rỡ nhất' }
    ],
    // phần đêm: hộp quà
    giftAppear: 'Trời tối rồi… có một món quà nhỏ đang chờ em đó',
    giftOpen: 'Mở ra xem nhé',
    lookUp: 'Hãy ngước nhìn lên bầu trời…',
    // bướm nói khi đậu trên tay
    butterfly: ['Chào {name}! 👋', 'Hôm nay em xinh lắm đó 💙'],
    // ảnh kỷ niệm: bay ra từ hộp quà; rotate: xoay ảnh (độ) nếu ảnh gốc bị nằm ngang
    photos: [
      { src: 'anh/003.jpg', caption: 'Nụ cười dịu dàng của em' },
      { src: 'anh/001.jpg', caption: 'Những ngày bình yên bên nhau', rotate: 90 },
      { src: 'anh/002.jpg', caption: 'Ánh mắt anh thương nhất' },
      { src: 'anh/004.jpg', caption: 'Cô gái hay phụng phịu của anh' }
    ],
    // yêu xa: hai nơi hai đứa đang ở (toạ độ để tính khoảng cách, múi giờ để hiện giờ thật)
    distance: {
      a: { city: 'Thái Bình', country: 'vn', lat: 20.4463, lon: 106.3366, tz: 'Asia/Ho_Chi_Minh' },
      b: { city: 'Seoul', country: 'kr', lat: 37.5665, lon: 126.978, tz: 'Asia/Seoul' },
      line: 'Mình cách nhau {km} km và {h} tiếng đồng hồ, nhưng vẫn chung một bầu trời, chung một vầng trăng 🌙'
    },
    finale: { text: 'Chúc mừng 20/10, {name}', sub: 'Luôn xinh đẹp, bình an và thật hạnh phúc nhé 💙' },
    wishes: [
      'Chúc em luôn khỏe mạnh và bình an',
      'Mong mọi điều em ước đều sẽ thành sự thật',
      'Chúc em luôn được yêu thương thật nhiều',
      'Cảm ơn em vì đã luôn là chính mình',
      'Mong mỗi sáng thức dậy em đều mỉm cười',
      'Em xứng đáng với tất cả những điều dịu dàng nhất',
      'Mỗi vì sao trên kia là một lời chúc dành cho em'
    ]
  };
  /* =============================================================== */

  document.querySelectorAll('[data-name]').forEach(e => { e.textContent = CONFIG.name; });
  if ((window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window) document.getElementById('tipTxt').textContent = 'Bật âm thanh nhé · Kéo nút tròn bên trái để đi, vuốt để nhìn quanh';

  const fail = (msg) => {
    const d = document.createElement('div');
    d.id = 'fallback';
    d.innerHTML = '<div><h1 style="font-family:var(--script);font-size:56px;margin:0">Chúc mừng 20/10, ' + CONFIG.name + '</h1><p>' + msg + '</p></div>';

  /* ---------- Grass: folded, curved blades in tufts; two tiles that wrap around the walker, so the meadow never ends ---------- */
  function makeGrass(N, TILE, inner, widthMul, seg) {
    const pos = [], idx = [];
    for (let i = 0; i < seg; i++) { const y = i / seg; pos.push(-1, y, 0, 0, y, 0, 1, y, 0); }

    for (let c = 0; c < N / 35; c++) {

      clumps.push({ x: (Math.random() - 0.5) * TILE, z: (Math.random() - 0.5) * TILE, ang: Math.random() * Math.PI, hs: 0.7 + Math.random() * 0.7,
        tint: dry ? 0.55 + Math.random() * 0.45 : Math.random() * 0.18, lean: 0.12 + Math.random() * 0.4 });
    }
    const off = new Float32Array(N * 3), par = new Float32Array(N * 4), par2 = new Float32Array(N * 2);

    if (e.pointerId === joy.id) {
      let dx = e.clientX - joy.x0, dy = e.clientY - joy.y0;
      const l = Math.hypot(dx, dy), m = 50;
      if (l > m) { dx *= m / l; dy *= m / l; }
      joy.dx = dx / m; joy.dy = dy / m;
      joyKnob.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
      return;
    }
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) drag.moved = true;
    if (controlLocked()) return;
    view.ty -= dx * TOUCH_SENS; view.tp -= dy * TOUCH_SENS; clampPitch();
  });
  const endPointer = e => {
    if (e.pointerId === joy.id) { joy.id = null; joy.dx = joy.dy = 0; joyEl.hidden = true; return; }
    if (pointerLocked && e.type === 'pointerup' && e.pointerType === 'mouse') { onTap(innerWidth / 2, innerHeight / 2); return; }
    if (drag && e.pointerId === drag.id) {
      if (!drag.moved && e.type === 'pointerup' && !onTap(e.clientX, e.clientY) && drag.type === 'mouse') lockPointer();
      drag = null;
    }
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  function onTap(x, y) {
    if (!started) return false;
    if (giftUnderPointer(x, y)) {
      if (gstate === 'waitOpen' && giftDist() < 3.6) tryOpenGift(); else startAutoWalk();
      return true;
    }
    if (gstate === 'opening' || gstate === 'done') {
      const it = pickPhoto(x, y);
      if (it) { if (pointerLocked && document.exitPointerLock) document.exitPointerLock(); openPhoto(it); return true; }
    }
    if (gstate !== 'done' || (!pointerLocked && !isTouch)) return false;
    let caught = false;
    for (const m of meteors) {
      if (!m.on) continue;
      tmpV.copy(m.head).add(CAM).project(camera);
      const sx = (tmpV.x * 0.5 + 0.5) * innerWidth, sy = (-tmpV.y * 0.5 + 0.5) * innerHeight;
      if (tmpV.z < 1 && Math.hypot(sx - x, sy - y) < 90) { caught = true; m.on = false; break; }
    }
    const w = CONFIG.wishes[wishIdx++ % CONFIG.wishes.length];
    if (caught) showLine('Em vừa bắt được một ngôi sao băng', 'Điều ước: ' + w + ' ✨', 6);
    else showLine(w, null, 5.5);
    return true;
  }

  /* ---------- Loop ---------- */
  const clock = new THREE.Clock();
  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.1);
    time += dt; U.uTime.value = time;
    if (started && !intro.active) T += dt;

    const sy = started ? sunYAt(T) : sunYAt(0);
    U.uMist.value = started ? 1 - smooth(4, 30, T) : 1;
    const el = Math.asin(Math.max(-1, Math.min(1, sy)));
    const saz = started ? sunAzAt(T) : sunAzAt(0);
    U.uSunDir.value.set(Math.sin(saz) * Math.cos(el), sy, -Math.cos(saz) * Math.cos(el)).normalize();
    applySky(sy);

    updateGift(dt);

    if (started) updatePlayer(dt);
    if (intro.active) updateIntro(dt);
    camera.position.copy(CAM);

    hemi.color.copy(U.uZen.value).lerp(U.uHor.value, 0.5);
    sunL.color.copy(U.uSunLight.value);
    sunL.position.copy(U.uSunDir.value).multiplyScalar(50);
    moonL.intensity = 0.8 * U.uNight.value;

    if (gstate === 'opening' && openT < 8.5) {
      view.ty += wrapAngle(0 - view.ty) * Math.min(1, dt * 1.6);
      view.tp = lerp(openPitch0, NAME_EL - 0.03, smooth(1.6, 7.5, openT));
    }
    const prevYaw = view.yaw, ks = 1 - Math.exp(-dt * 14);
    view.yaw += (view.ty - view.yaw) * ks;
    view.pitch += (view.tp - view.pitch) * ks;
    const turn = (view.yaw - prevYaw) / Math.max(dt, 1e-3);
    const strafe = player.vx * Math.cos(view.yaw) - player.vz * Math.sin(view.yaw);
    const rollT = Math.max(-0.03, Math.min(0.03, turn * 0.01)) - strafe * 0.005;
    view.roll += (rollT - view.roll) * Math.min(1, dt * 5);
    camera.rotation.set(view.pitch, view.yaw, view.roll);
    const running = (keys.ShiftLeft || keys.ShiftRight) && Math.hypot(player.vx, player.vz) > 4;
    const fovT = intro.active ? intro.fov : baseFov + (running ? 5 : 0);
    if (Math.abs(fovT - camera.fov) > 0.01) { camera.fov += (fovT - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix(); }
    updateGuide();
    nameU.uBoxRel.value.copy(BOX).sub(CAM);
    skyFollow.forEach(o => o.position.copy(CAM));

    nameU.uProg.value = (gstate === 'opening' || gstate === 'done') ? Math.max(0, (openT - 1.1) / 9) : 0;

    if (started) {
      while (storyIdx < CONFIG.story.length && T >= CONFIG.story[storyIdx].at) {
        const st = CONFIG.story[storyIdx++];
        showLine(st.text, st.sub, st.dur);
      }
      if (U.uNight.value > 0.7) { nextMeteor -= dt; if (nextMeteor <= 0) { spawnMeteor(); nextMeteor = 2.5 + Math.random() * 5; } }
    }
    updateMeteors(dt);
    updateAmbience(dt);

    sky.position.copy(CAM); clouds.position.copy(CAM);
    if (composer) {
      const nt = U.uNight.value;
      bloom.strength = lerp(0.16, 1.05, nt);
      bloom.threshold = lerp(0.94, 0.6, nt);
      bloom.radius = lerp(0.45, 0.6, nt);
      finalPass.uniforms.uTime.value = time;
      const blurT = (gstate === 'waitOpen' ? 0.8 * (1 - smooth(2.5, 4.5, giftDist())) : gstate === 'opening' ? 1 - smooth(1.4, 3.5, openT) : 0) * (isMobile ? 0.7 : 1);
      finalPass.uniforms.uBlur.value += (Math.max(blurT, intro.blur) - finalPass.uniforms.uBlur.value) * Math.min(1, dt * 3);
      composer.render(dt);
    } else renderer.render(scene, camera);
    if (started) watchPerf(dt);
  }
  loop();
})();
</script>
